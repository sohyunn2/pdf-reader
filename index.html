<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDF 서재">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>PDF 서재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
  @font-face { font-family: 'PretendardLocal'; font-weight: 45 920; font-display: swap;
    src: url('fonts/PretendardVariable.woff2') format('woff2-variations'), url('fonts/PretendardVariable.woff2') format('woff2'); }
  :root {
    --bg: #ffffff; --fg: #1f2329; --sub: #7a7f87; --line: #e6e8eb;
    --card: #f5f6f8; --accent: #3b82f6; --btn: #eceef1;
    --sans: 'Pretendard Variable', 'PretendardLocal', 'Nanum Gothic', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    --serif: 'Noto Serif KR', 'AppleMyungjo', serif;
    --body-font: var(--sans);
    --size: 17px;
  }
  [data-theme="dark"]  { --bg: #0b0d12; --fg: #d9dbe0; --sub: #8a8f99; --line: #23262d; --card: #161920; --btn: #2a2e37; }
  [data-theme="sky"]      { --bg: #f2f8fd; --fg: #22374a; --sub: #6b8296; --line: #dde9f3; --card: #e6f0f9; --btn: #dae8f4; }
  [data-theme="sage"]     { --bg: #f2f6ef; --fg: #2c3a28; --sub: #6f7f68; --line: #e0e8da; --card: #e7eee2; --btn: #dbe5d4; }
  [data-theme="lavender"] { --bg: #f6f4fb; --fg: #352f4d; --sub: #7c7594; --line: #e6e2f2; --card: #ece8f6; --btn: #e1dcf0; }
  [data-theme="paper"]    { --bg: #fcfaf5; --fg: #2f2a24; --sub: #8a8174; --line: #ede8dc; --card: #f4f0e6; --btn: #ece6d8; }
  [data-theme="sepia"]    { --bg: #f8f2e4; --fg: #4a3b2a; --sub: #8c7a62; --line: #e9dfc8; --card: #f0e7d2; --btn: #e8dcc2; }
  [data-font="serif"] { --body-font: var(--serif); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
    transition: background .2s, color .2s; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* 상단 바 */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
    height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar h1 { flex: 1; margin: 0; font-size: 19px; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 10px;
    display: grid; place-items: center; font-size: 20px; }
  .icon-btn:active { background: var(--btn); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; }

  /* 서재 */
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 20px 80px; }
  .add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 14px; border: 1.5px dashed var(--sub); border-radius: 14px; background: none;
    font-size: 15px; color: var(--sub); }
  .status { margin: 12px 0 0; font-size: 14px; color: var(--sub); text-align: center; min-height: 20px; }
  .sort { display: flex; justify-content: flex-end; gap: 4px; margin-top: 4px; }
  .sort button { border: 0; background: none; padding: 6px 8px; font-size: 13px; color: var(--sub); border-radius: 8px; }
  .sort button.on { color: var(--fg); font-weight: 600; background: var(--card); }
  .book { display: flex; align-items: center; gap: 12px; padding: 16px; margin-top: 12px;
    background: var(--card); border-radius: 14px; }
  .book-main { flex: 1; min-width: 0; cursor: pointer; }
  .book-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-meta { margin-top: 6px; font-size: 12.5px; color: var(--sub); }
  .bar { margin-top: 8px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .empty { margin-top: 60px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.7; }

  /* 리더 */
  #readView .topbar { position: fixed; left: 0; right: 0; top: 0; transition: transform .25s; }
  #readView .article { padding-top: calc(92px + env(safe-area-inset-top)); }
  #readView.chrome-off .topbar { transform: translateY(-100%); }
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg);
    border-top: 1px solid var(--line); padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    transition: transform .25s; }
  #readView.chrome-off .bottombar { transform: translateY(110%); }
  .bottombar .inner { max-width: 680px; margin: 0 auto; }
  .bottombar input { width: 100%; }
  .bottombar .pos { text-align: center; font-size: 13px; color: var(--sub); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pager { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; }
  .cols { position: absolute; column-fill: auto; transition: transform .28s ease; will-change: transform; }
  .cols .article { padding: 0 !important; max-width: none; margin: 0; }
  .cols .art-title { margin-top: 0; }
  .article { max-width: 680px; margin: 0 auto; padding: 36px 22px 120px; }
  .art-title { font-family: var(--body-font); font-size: calc(var(--size) * 1.55); font-weight: 700;
    line-height: 1.4; margin: 0 0 10px; word-break: keep-all; }
  .art-meta { font-size: 13px; color: var(--sub); padding-bottom: 22px; margin-bottom: 28px;
    border-bottom: 1px solid var(--line); }
  .body { font-family: var(--body-font); font-size: var(--size); line-height: 1.95;
    text-align: left; letter-spacing: -0.01em; }
  .body.merged { text-align: justify; }
  .body p { margin: 0; min-height: 1.95em; }
  .body p.ind { text-indent: 1em; }

  .body.merged p.blank { min-height: 0; }
  .end { margin-top: 48px; text-align: center; color: var(--sub); font-size: 13px; }

  /* 설정 패널 */
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); }
  .sheet { position: fixed; left: 0; right: 0; top: calc(56px + env(safe-area-inset-top)); z-index: 21; max-width: 720px; margin: 0 auto;
    background: var(--bg); border-bottom: 1px solid var(--line); border-radius: 0 0 18px 18px;
    padding: 18px 20px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .row { margin-bottom: 18px; }
  .row:last-child { margin-bottom: 0; }
  .row-label { font-size: 13px; color: var(--sub); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .seg { display: flex; gap: 8px; }
  .seg button { flex: 1; padding: 11px 0; border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--card); font-size: 14px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .seg.grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .seg.grid button { padding: 10px 0; font-size: 13px; }
  .seg .t-light { background: #fff; color: #1f2329; }
  .seg .t-dark  { background: #0b0d12; color: #d9dbe0; }
  .seg .t-sky   { background: #f2f8fd; color: #22374a; }
  .seg .t-sage  { background: #f2f6ef; color: #2c3a28; }
  .seg .t-lavender { background: #f6f4fb; color: #352f4d; }
  .seg .t-paper { background: #fcfaf5; color: #2f2a24; }
  .seg .t-sepia { background: #f8f2e4; color: #4a3b2a; }
  .seg .f-sans  { font-family: var(--sans); }
  .seg .f-serif { font-family: var(--serif); }
  .slider { display: flex; align-items: center; gap: 12px; }
  .slider span { font-size: 13px; color: var(--sub); }
  .slider span.big { font-size: 20px; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }

  /* 다이얼로그 */
  .dlg-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .dlg { width: 100%; max-width: 340px; background: var(--bg); border-radius: 16px; padding: 20px; }
  .dlg h3 { margin: 0 0 14px; font-size: 16px; }
  .dlg input { width: 100%; padding: 11px 12px; font-size: 15px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--fg); font-family: inherit; }
  .dlg p { margin: 0 0 4px; font-size: 14px; color: var(--sub); line-height: 1.6; }
  .dlg-btns { display: flex; gap: 8px; margin-top: 18px; }
  .dlg-btns button { flex: 1; padding: 12px 0; border: 0; border-radius: 10px; background: var(--btn); font-size: 14px; }
  .dlg-btns .primary { background: var(--accent); color: #fff; font-weight: 600; }
  .dlg-btns .danger { background: #e5484d; color: #fff; font-weight: 600; }
  .menu-list button { display: block; width: 100%; text-align: left; padding: 13px 4px; border: 0;
    background: none; font-size: 15px; border-bottom: 1px solid var(--line); }
  .menu-list button:last-child { border-bottom: 0; }
  .menu-list .del { color: #e5484d; }
</style>
</head>
<body>
<div id="saProbe" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)"></div>

<!-- 서재 화면 -->
<section id="libView">
  <header class="topbar">
    <h1>서재</h1>
    <button class="icon-btn" id="libGear" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div class="wrap">
    <button class="add-btn" id="addBtn">＋ PDF 추가</button>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple class="hidden">
    <p class="status" id="status"></p>
    <div class="sort" id="sortSeg"><button data-v="title">제목순</button><button data-v="recent">최근 읽은 순</button></div>
    <div id="bookList"></div>
  </div>
</section>

<!-- 리더 화면 -->
<section id="readView" class="hidden">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="뒤로">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="readTitle"></h1>
    <button class="icon-btn" id="readGear" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="progress" id="progress"></div>
  </header>
  <div id="pager" class="pager hidden"><div id="cols" class="cols"></div></div>
  <article class="article" id="article">
    <h2 class="art-title" id="artTitle"></h2>
    <div class="art-meta" id="artMeta"></div>
    <div class="body" id="artBody"></div>
    <div class="end">— 끝 —</div>
  </article>
  <div class="bottombar" id="bottomBar"><div class="inner">
    <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="읽은 위치">
    <div class="pos" id="pos"></div>
  </div></div>
</section>

<!-- 설정 패널 -->
<div id="sheetBg" class="sheet-bg hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="row">
    <div class="row-label">화면 모드</div>
    <div class="seg grid" id="themeSeg">
      <button data-v="light" class="t-light">백</button>
      <button data-v="dark" class="t-dark">흑</button>
      <button data-v="sky" class="t-sky">하늘</button>
      <button data-v="sage" class="t-sage">세이지</button>
      <button data-v="lavender" class="t-lavender">라벤더</button>
      <button data-v="paper" class="t-paper">종이책</button>
      <button data-v="sepia" class="t-sepia">세피아</button>
    </div>
  </div>
  <div class="row">
    <div class="row-label">글씨체</div>
    <div class="seg" id="fontSeg">
      <button data-v="sans" class="f-sans">고딕</button>
      <button data-v="serif" class="f-serif">명조</button>
    </div>
  </div>
  <div class="row">
    <div class="row-label">보기 방식</div>
    <div class="seg" id="viewSeg">
      <button data-v="scroll">스크롤</button>
      <button data-v="page">페이지 넘기기</button>
    </div>
  </div>
  <div class="row">
    <div class="row-label">줄바꿈</div>
    <div class="seg" id="wrapSeg">
      <button data-v="orig">PDF 원본 그대로</button>
      <button data-v="merge">문단 이어붙이기</button>
    </div>
  </div>
  <div class="row">
    <div class="row-label"><span>글자 크기</span><span id="sizeVal"></span></div>
    <div class="slider">
      <span>가</span>
      <input type="range" id="sizeRange" min="13" max="26" step="1">
      <span class="big">가</span>
    </div>
  </div>
</div>

<!-- 다이얼로그 -->
<div id="dlgBg" class="dlg-bg hidden"><div class="dlg" id="dlg"></div></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);

  /* ---------- 설정 저장 ---------- */
  const DEF = { theme: 'dark', font: 'sans', size: 17, wrap: 'merge', sort: 'title', view: 'scroll' };
  let settings = { ...DEF };
  try { settings = { ...DEF, ...JSON.parse(localStorage.getItem('reader-settings') || '{}') }; } catch (e) {}
  function saveSettings() { try { localStorage.setItem('reader-settings', JSON.stringify(settings)); } catch (e) {} }
  function applySettings() {
    document.documentElement.dataset.theme = settings.theme;
    requestAnimationFrame(() => { const m = document.querySelector('meta[name=theme-color]');
      if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); });
    document.documentElement.dataset.font = settings.font;
    document.documentElement.style.setProperty('--size', settings.size + 'px');
    $('sizeRange').value = settings.size;
    $('sizeVal').textContent = settings.size;
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.theme));
    document.querySelectorAll('#fontSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.font));
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.view));
    document.querySelectorAll('#wrapSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.wrap));
  }

  /* ---------- IndexedDB ---------- */
  let dbp = null;
  const mem = new Map(); // IndexedDB 안 될 때 임시 저장
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('pdf-reader', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('books', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    }).catch(() => null);
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    if (!d) return fn(null);
    return new Promise((res, rej) => {
      const t = d.transaction('books', mode); const s = t.objectStore('books');
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  const store = {
    async all() { const d = await db(); if (!d) return [...mem.values()];
      return tx('readonly', s => s.getAll()); },
    async get(id) { const d = await db(); if (!d) return mem.get(id);
      return tx('readonly', s => s.get(id)); },
    async put(b) { const d = await db(); if (!d) { mem.set(b.id, b); return; }
      return tx('readwrite', s => s.put(b)); },
    async del(id) { const d = await db(); if (!d) { mem.delete(id); return; }
      return tx('readwrite', s => s.delete(id)); }
  };

  /* ---------- PDF → 줄 단위 텍스트 ---------- */
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  async function extract(buf) {
    const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
    const out = []; // {t: text, ind: bool}
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      // 같은 줄(y)끼리 묶기
      const lines = [];
      let cur = null;
      for (const it of tc.items) {
        if (typeof it.str !== 'string') continue;
        const x = it.transform[4], y = it.transform[5];
        const h = Math.abs(it.transform[3]) || it.height || 10;
        if (!cur || Math.abs(y - cur.y) > h * 0.5) {
          if (cur) lines.push(cur);
          cur = { y, x, h, parts: [], lastEnd: null };
        }
        if (it.str.length) {
          // 단어 사이 간격이 있는데 공백이 없으면 공백 넣기
          if (cur.lastEnd !== null && x - cur.lastEnd > h * 0.25 &&
              !/\s$/.test(cur.parts.join('')) && !/^\s/.test(it.str)) cur.parts.push(' ');
          if (!cur.parts.length) cur.x = x;
          cur.parts.push(it.str);
          if (it.str.trim()) cur.lastEnd = x + (it.width || 0);
          cur.h = Math.max(cur.h, h);
        }
        if (it.hasEOL) { lines.push(cur); cur = null; }
      }
      if (cur) lines.push(cur);
      const real = lines.filter(l => l.parts.join('').trim().length);
      if (!real.length) continue;

      // 왼쪽 기준선 & 보통 줄 간격
      const minX = Math.min(...real.map(l => l.x));
      const maxR = Math.max(...real.map(l => l.lastEnd || 0));
      const gaps = [];
      for (let i = 1; i < real.length; i++) gaps.push(Math.abs(real[i - 1].y - real[i].y));
      const sorted = gaps.filter(g => g > 0).sort((a, b) => a - b);
      const norm = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 14;

      real.forEach((l, i) => {
        if (i > 0) {
          const g = Math.abs(real[i - 1].y - l.y);
          const blanks = Math.min(8, Math.round(g / norm) - 1);
          for (let k = 0; k < blanks; k++) out.push({ t: '', ind: false });
        }
        const raw = l.parts.join('');
        const ind = (l.x - minX) > l.h * 0.3;
        const end = (maxR - (l.lastEnd || 0)) > l.h * 1.5; // 오른쪽 끝까지 안 간 줄 = 문단 끝
        out.push({ t: raw.trim(), ind, end, sp: /\s$/.test(raw), lsp: /^\s/.test(raw) });
      });
      page.cleanup();
    }
    // 앞뒤 빈 줄 정리 + 연속 빈 줄 최대 2개
    const res = [];
    for (const l of out) {
      if (!l.t && !res.length) continue;
      res.push(l);
    }
    while (res.length && !res[res.length - 1].t) res.pop();
    return { lines: res, pages: pdf.numPages };
  }

  /* ---------- 서재 ---------- */
  const status = msg => { $('status').textContent = msg || ''; };
  const fmtDate = ts => { const d = new Date(ts);
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; };

  async function renderLib() {
    let books = [];
    try { books = await store.all(); } catch (e) {}
    if (settings.sort === 'recent') books.sort((a, b) => (b.lastRead || b.added) - (a.lastRead || a.added));
    else books.sort((a, b) => a.title.localeCompare(b.title, 'ko', { numeric: true, sensitivity: 'base' }));
    document.querySelectorAll('#sortSeg button').forEach(x => x.classList.toggle('on', x.dataset.v === settings.sort));
    const list = $('bookList');
    list.innerHTML = '';
    if (!books.length) {
      list.innerHTML = '<div class="empty">아직 올린 PDF가 없어요.<br>위의 <b>＋ PDF 추가</b>를 눌러 올려 보세요.</div>';
      return;
    }
    for (const b of books) {
      const pct = Math.round((b.progress || 0) * 100);
      const el = document.createElement('div');
      el.className = 'book';
      el.innerHTML = `
        <div class="book-main">
          <div class="book-title"></div>
          <div class="book-meta">${b.lastRead ? '최근 ' + fmtDate(b.lastRead) : '추가 ' + fmtDate(b.added)} · ${b.pageTotal ? `${b.pageNo} / ${b.pageTotal} · ` : ''}${pct}%</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
        <button class="icon-btn" aria-label="더보기">⋯</button>`;
      el.querySelector('.book-title').textContent = b.title;
      el.querySelector('.book-main').onclick = () => openBook(b.id);
      el.querySelector('.icon-btn').onclick = () => bookMenu(b);
      list.appendChild(el);
    }
  }

  async function addFiles(files) {
    if (!window.pdfjsLib) { status('PDF 엔진을 불러오지 못했어요. 새로고침해 주세요.'); return; }
    let ok = 0;
    for (const f of files) {
      status(`"${f.name}" 읽는 중…`);
      try {
        const buf = await f.arrayBuffer();
        const { lines, pages } = await extract(new Uint8Array(buf));
        if (!lines.some(l => l.t)) {
          showDialog(`<h3>글자를 찾을 수 없어요</h3><p>"${esc(f.name)}"은(는) 스캔한 이미지 PDF 같아요. 글자를 선택할 수 있는 PDF만 읽을 수 있어요.</p>`,
            [{ label: '확인', cls: 'primary' }]);
          continue;
        }
        await store.put({
          id: 'b' + Date.now() + Math.random().toString(36).slice(2, 7),
          title: f.name.replace(/\.pdf$/i, ''),
          lines, pages, added: Date.now(), lastRead: 0, progress: 0
        });
        ok++;
      } catch (e) {
        console.error(e);
        showDialog(`<h3>열 수 없는 PDF예요</h3><p>"${esc(f.name)}" 파일을 읽다가 문제가 생겼어요. (암호가 걸렸거나 손상된 파일일 수 있어요)</p>`,
          [{ label: '확인', cls: 'primary' }]);
      }
    }
    status(ok ? `${ok}개 추가했어요` : '');
    setTimeout(() => status(''), 2500);
    renderLib();
  }

  function bookMenu(b) {
    showDialog(`<h3></h3><div class="menu-list">
        <button data-a="rename">이름 바꾸기</button>
        <button data-a="reset">처음부터 읽기</button>
        <button data-a="del" class="del">삭제</button>
        <button data-a="close">닫기</button></div>`, [], dlg => {
      dlg.querySelector('h3').textContent = b.title;
      dlg.querySelectorAll('.menu-list button').forEach(btn => btn.onclick = async () => {
        const a = btn.dataset.a;
        if (a === 'close') return closeDialog();
        if (a === 'reset') { b.progress = 0; await store.put(b); closeDialog(); return renderLib(); }
        if (a === 'rename') return renameDialog(b);
        if (a === 'del') return deleteDialog(b);
      });
    });
  }
  function renameDialog(b) {
    showDialog('<h3>이름 바꾸기</h3><input id="rnInput">', [
      { label: '취소' },
      { label: '저장', cls: 'primary', fn: async () => {
          const v = $('rnInput').value.trim(); if (v) { b.title = v; await store.put(b); renderLib(); } } }
    ], () => { const i = $('rnInput'); i.value = b.title; i.focus(); i.select(); });
  }
  function deleteDialog(b) {
    showDialog('<h3>삭제할까요?</h3><p></p>', [
      { label: '취소' },
      { label: '삭제', cls: 'danger', fn: async () => { await store.del(b.id); renderLib(); } }
    ], dlg => { dlg.querySelector('p').textContent = `"${b.title}"을(를) 서재에서 지워요. 읽던 위치도 함께 사라져요.`; });
  }

  /* ---------- 리더 ---------- */
  let current = null, saveTimer = null;

  async function openBook(id) {
    const b = await store.get(id);
    if (!b) return;
    current = b;
    $('readTitle').textContent = b.title;
    $('artTitle').textContent = b.title;
    $('artMeta').textContent = `PDF ${b.pages}쪽 · 추가 ${fmtDate(b.added)}`;
    renderBody();
    $('libView').classList.add('hidden');
    $('readView').classList.remove('hidden');
    $('readView').classList.remove('chrome-off');
    setupView();
    requestAnimationFrame(() => setRatio(current.progress || 0));
  }
  // 줄 → 문단 (빈 줄이나 들여쓴 줄에서 새 문단)
  function mergeLines(lines) {
    // 줄 끝 띄어쓰기 정보가 PDF에 남아 있는지 확인 → 있으면 그 정보대로, 없으면 기본 공백
    let wraps = 0, marked = 0;
    for (let i = 0; i + 1 < lines.length; i++) {
      const a = lines[i], b = lines[i + 1];
      if (a.t && b.t && !b.ind) { wraps++; if (a.sp || b.lsp) marked++; }
    }
    const trust = wraps > 0 && marked / wraps >= 0.1;
    const latin = (a, b) => /[A-Za-z0-9]$/.test(a) && /^[A-Za-z0-9]/.test(b);
    const decide = trust ? null : wrapJudge(lines);
    const paras = []; let cur = null, prev = null, blanks = 0;
    for (const l of lines) {
      if (!l.t) { if (cur) { paras.push(cur); cur = null; } prev = null; blanks++; continue; }
      if (cur && !l.ind && !(prev && prev.end)) {
        // 한글 문서는 대부분 띄어쓰기 자리에서 줄이 넘어가서 기본은 공백 넣기
        const needSpace = trust ? ((prev && prev.sp) || l.lsp || latin(cur.t, l.t)) : decide(cur.t, l.t);
        cur.t += (needSpace ? ' ' : '') + l.t;
      } else {
        if (cur) paras.push(cur);
        cur = { t: l.t, ind: l.ind, gap: paras.length ? blanks : 0 }; // 원본에 있던 빈 줄 수 그대로
        blanks = 0;
      }
      prev = l;
    }
    if (cur) paras.push(cur);
    return paras;
  }
  // 줄 끝 띄어쓰기 정보가 없는 PDF용: 글 전체에 나온 단어들을 사전처럼 써서
  // "속닥거리|기도" 같은 단어 중간 줄바꿈인지, "질질|끌리는" 같은 띄어쓰기 자리인지 판단
  function wrapJudge(lines) {
    const core = w => w.replace(/^[^가-힣A-Za-z0-9]+|[^가-힣A-Za-z0-9]+$/g, '');
    const count = new Map(); const prefixes = new Map();
    for (const l of lines) {
      const ws = l.t.split(/\s+/);
      for (let i = 1; i < ws.length - 1; i++) { // 줄 맨앞/맨끝 단어는 잘렸을 수 있어서 제외
        const c = core(ws[i]); if (!c) continue;
        count.set(c, (count.get(c) || 0) + 1);
        for (let k = 2; k <= Math.min(6, c.length); k++) { const pre = c.slice(0, k); prefixes.set(pre, (prefixes.get(pre) || 0) + 1); }
      }
    }
    const ENDINGS = '다가이을를은는에의도로고게지냐요서며면었았했였니까기야께나랑와과든던라만며엔예';
    return (prevText, nextText) => {
      const A = prevText.split(/\s+/).pop(), B = nextText.split(/\s+/)[0];
      if (/[.,!?…~"'”’)\]>」』]$/.test(A)) return true;        // 문장/따옴표 끝 → 띄어쓰기
      if (/^[.,!?…~)\]”’」』]/.test(B)) return false;           // 문장부호로 시작 → 붙이기
      const a = core(A), b = core(B);
      if (!/[가-힣]$/.test(a) || !/^[가-힣]/.test(b)) return /[A-Za-z0-9]$/.test(a) && /^[A-Za-z0-9]/.test(b) ? true : !!(a && b);
      const ab = a + b;
      if (count.get(ab)) return false;                          // 붙인 단어가 글에 나온 적 있음
      if (a.length === 1 && (count.get(a) || 0) < 3) return false; // 혼자 잘 안 쓰이는 한 글자 → 단어가 잘린 것
      if (count.get(a) && count.get(b)) return true;            // 둘 다 따로 쓰인 단어
      if (!count.get(b) && !(b.length >= 2 && prefixes.get(b.slice(0, 2)))) return false; // 뒷부분이 글 어디에도 단어로 안 나옴 → 잘린 조각
      if (prefixes.get(a + b.slice(0, Math.min(2, b.length)))) return false; // 붙인 모양으로 시작하는 단어가 있음
      if (count.get(b) && b.length >= 2) return true;
      return !ENDINGS.includes(b[0]);                           // 어미/조사로 시작하면 붙이기
    };
  }
  function renderBody() {
    if (!current) return;
    const merged = settings.wrap === 'merge';
    const items = merged ? mergeLines(current.lines) : current.lines;
    const body = $('artBody');
    body.classList.toggle('merged', merged);
    const frag = document.createDocumentFragment();
    for (const l of items) {
      const p = document.createElement('p');
      if (l.ind) p.className = 'ind';
      if (merged && l.gap) p.style.marginTop = (l.gap * 1.95) + 'em';
      p.textContent = l.t;
      frag.appendChild(p);
    }
    body.innerHTML = '';
    body.appendChild(frag);
  }
  /* 보기 방식: 스크롤 / 페이지 */
  let page = 0, total = 1, step = 0;
  const isPage = () => current && settings.view === 'page';
  function setupView() {
    const art = $('article');
    if (settings.view === 'page') {
      $('cols').appendChild(art);
      $('pager').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      layoutPages();
    } else {
      $('pager').classList.add('hidden');
      $('readView').insertBefore(art, $('bottomBar'));
      document.body.style.overflow = '';
    }
  }
  function layoutPages() {
    const vw = innerWidth, vh = innerHeight;
    const probe = $('saProbe'), cs = getComputedStyle(probe);
    const sa = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const pad = Math.max(22, (vw - 680) / 2), top = 40 + sa, bottom = 48 + sb;
    const c = $('cols');
    c.style.transition = 'none';
    c.style.left = pad + 'px'; c.style.top = top + 'px';
    c.style.width = (vw - 2 * pad) + 'px'; c.style.height = (vh - top - bottom) + 'px';
    c.style.columnWidth = (vw - 2 * pad) + 'px'; c.style.columnGap = (2 * pad) + 'px';
    step = vw;
    total = Math.max(1, Math.round((c.scrollWidth + 2 * pad) / vw));
    void c.offsetWidth; c.style.transition = '';
  }
  function goPage(n, animate = true) {
    page = Math.max(0, Math.min(total - 1, n));
    const c = $('cols');
    if (!animate) c.style.transition = 'none';
    c.style.transform = `translateX(${-page * step}px)`;
    if (!animate) { void c.offsetWidth; c.style.transition = ''; }
    onMove();
  }
  function ratio() {
    if (isPage()) return total > 1 ? page / (total - 1) : 1;
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 1;
  }
  function setRatio(r) {
    if (isPage()) { goPage(Math.round(r * (total - 1)), false); return; }
    const max = document.documentElement.scrollHeight - innerHeight;
    scrollTo(0, Math.max(0, r * max)); onMove();
  }
  function onMove() {
    if (!current) return;
    const r = ratio(), pct = Math.round(r * 100);
    $('progress').style.width = (r * 100) + '%';
    const seek = $('seek');
    if (isPage()) { current.pageNo = page + 1; current.pageTotal = total;
      seek.max = total - 1; seek.value = page; $('pos').textContent = `${page + 1} / ${total} · ${pct}%`; }
    else {
      // 스크롤 모드: 화면 한 장 높이를 1페이지로 계산
      const ph = Math.max(200, innerHeight - 40);
      const n = Math.max(1, Math.ceil(document.documentElement.scrollHeight / ph));
      const cur = Math.min(n, Math.floor(scrollY / ph) + 1);
      current.pageNo = cur; current.pageTotal = n;
      seek.max = 1000; seek.value = Math.round(r * 1000); $('pos').textContent = `${cur} / ${n} · ${pct}%`;
    }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveProgress, 400);
  }
  $('seek').oninput = e => {
    const v = +e.target.value;
    if (isPage()) goPage(v, false); else setRatio(v / 1000);
  };
  async function saveProgress() {
    if (!current) return;
    current.progress = ratio();
    current.lastRead = Date.now();
    try { await store.put(current); } catch (e) {}
  }
  addEventListener('scroll', () => { if (current && !isPage()) onMove(); }, { passive: true });
  addEventListener('resize', () => { if (isPage()) { const r = ratio(); layoutPages(); setRatio(r); } });
  const relayout = () => { if (isPage()) { const r = ratio(); layoutPages(); setRatio(r); } };
  try { document.fonts.addEventListener('loadingdone', relayout); } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

  // 화면 터치: 가운데 = 메뉴/진행도 보이기·숨기기, 페이지 모드에서 양옆 = 이전/다음
  const toggleChrome = () => $('readView').classList.toggle('chrome-off');
  $('article').addEventListener('click', e => { if (!isPage() && !window.getSelection().toString()) toggleChrome(); });
  let sx = 0, sy = 0, swiped = false;
  $('pager').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false; }, { passive: true });
  $('pager').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; goPage(page + (dx < 0 ? 1 : -1)); }
  });
  $('pager').addEventListener('click', e => {
    if (swiped) { swiped = false; return; }
    const x = e.clientX / innerWidth;
    if (x < 0.3) goPage(page - 1); else if (x > 0.7) goPage(page + 1); else toggleChrome();
  });
  addEventListener('keydown', e => {
    if (!isPage() || !$('dlgBg').classList.contains('hidden')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goPage(page + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(page - 1); }
  });

  async function closeBook() {
    clearTimeout(saveTimer);
    await saveProgress();
    current = null;
    $('pager').classList.add('hidden');
    document.body.style.overflow = '';
    $('readView').classList.add('hidden');
    $('libView').classList.remove('hidden');
    scrollTo(0, 0);
    renderLib();
  }

  /* ---------- 설정 패널 ---------- */
  function toggleSheet(show) {
    $('sheet').classList.toggle('hidden', !show);
    $('sheetBg').classList.toggle('hidden', !show);
  }
  function changeKeepingPlace(fn) {
    const r = current ? ratio() : 0;
    fn(); applySettings(); saveSettings();
    if (current) requestAnimationFrame(() => {
      setupView();
      requestAnimationFrame(() => setRatio(r));
    });
  }
  $('viewSeg').onclick = e => { const v = e.target.dataset.v; if (v) changeKeepingPlace(() => settings.view = v); };
  $('themeSeg').onclick = e => { const v = e.target.dataset.v; if (v) changeKeepingPlace(() => settings.theme = v); };
  $('wrapSeg').onclick = e => { const v = e.target.dataset.v; if (v) changeKeepingPlace(() => { settings.wrap = v; applySettings(); renderBody(); }); };
  $('fontSeg').onclick = e => { const v = e.target.dataset.v; if (v) changeKeepingPlace(() => settings.font = v); };
  $('sizeRange').oninput = e => changeKeepingPlace(() => settings.size = +e.target.value);

  /* ---------- 다이얼로그 ---------- */
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function showDialog(html, buttons, after) {
    const dlg = $('dlg');
    dlg.innerHTML = html + (buttons.length ? '<div class="dlg-btns"></div>' : '');
    const box = dlg.querySelector('.dlg-btns');
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.textContent = b.label; if (b.cls) el.className = b.cls;
      el.onclick = async () => { closeDialog(); if (b.fn) await b.fn(); };
      box.appendChild(el);
    });
    $('dlgBg').classList.remove('hidden');
    if (after) after(dlg);
  }
  function closeDialog() { $('dlgBg').classList.add('hidden'); }
  $('dlgBg').onclick = e => { if (e.target === $('dlgBg')) closeDialog(); };

  /* ---------- 연결 ---------- */
  $('sortSeg').onclick = e => { const v = e.target.dataset.v; if (v) { settings.sort = v; saveSettings(); renderLib(); } };
  $('addBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addFiles(fs); };
  $('backBtn').onclick = closeBook;
  $('libGear').onclick = () => toggleSheet(true);
  $('readGear').onclick = () => toggleSheet($('sheet').classList.contains('hidden'));
  $('sheetBg').onclick = () => toggleSheet(false);
  // 파일 끌어다 놓기 (맥북용)
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => {
    e.preventDefault();
    const fs = [...(e.dataTransfer?.files || [])].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
    if (fs.length && !current) addFiles(fs);
  });

  // 브라우저가 서재 데이터를 함부로 지우지 않게 '영구 저장' 요청
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  applySettings();
  renderLib();
})();
</script>
</body>
</html>
